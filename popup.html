<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Picker</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <section id="pickerView">
    <header class="header">
      <h1 id="pickerTitle">Color Picker</h1>
    </header>
    <div id="swatch" class="swatch"></div>
    <label class="field-label" for="hexInput">Hex</label>
    <input id="hexInput" type="text" value="#3B82F6" spellcheck="false" />
    <button id="copyBtn" class="download-btn" type="button">Copy</button>
    <p id="pickerStatus" class="hint">Click Copy to copy the color.</p>
  </section>

  <section id="settingsView" hidden>
    <header class="header">
      <h1>Settings</h1>
    </header>

    <label class="field-label" for="uploadUrl">Upload URL</label>
    <input id="uploadUrl" type="url" placeholder="https://your-service.onrender.com" />

    <label class="field-label" for="token">Token</label>
    <input id="token" type="password" autocomplete="off" />

    <label class="check"><input id="autoExport" type="checkbox" checked /> Auto-export on open</label>
    <label class="check"><input id="pollRemote" type="checkbox" checked /> Poll remote trigger</label>

    <button id="saveBtn" class="download-btn" type="button">Save</button>
    <p id="settingsStatus" class="status" role="status"></p>

    <label class="field-label" for="chatSelect">Manual chat</label>
    <select id="chatSelect" disabled>
      <option value="">Loading chats…</option>
    </select>

    <div class="date-row">
      <div class="date-field">
        <label class="field-label" for="fromDate">From</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="date-field">
        <label class="field-label" for="toDate">To</label>
        <input type="date" id="toDate" />
      </div>
    </div>

    <button id="downloadBtn" class="download-btn secondary" type="button" disabled>Download TXT</button>
  </section>

  <script src="popup.js"></script>
</body>

</html>
