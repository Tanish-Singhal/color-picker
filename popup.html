<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Picker</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <section id="pickerView">
    <header class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1 id="pickerTitle">Color Picker</h1>
        <p class="brand-sub">Sample, tune, and copy any color</p>
      </div>
    </header>

    <div class="preview">
      <div id="swatch" class="swatch"></div>
      <div class="preview-meta">
        <strong id="previewHex">#3B82F6</strong>
        <span id="previewRgb">RGB 59, 130, 246</span>
      </div>
    </div>

    <div class="sliders">
      <label>R <input id="sliderR" type="range" min="0" max="255" value="59" /></label>
      <label>G <input id="sliderG" type="range" min="0" max="255" value="130" /></label>
      <label>B <input id="sliderB" type="range" min="0" max="255" value="246" /></label>
    </div>

    <label class="field-label" for="hexInput">Hex</label>
    <input id="hexInput" type="text" value="#3B82F6" spellcheck="false" maxlength="16" autocomplete="off" />

    <div class="formats" id="formats"></div>

    <div class="actions">
      <button id="copyBtn" class="download-btn" type="button">Copy hex</button>
      <button id="eyeBtn" class="download-btn ghost" type="button">Pick from screen</button>
    </div>

    <p class="field-label">Recent</p>
    <div id="palette" class="palette"></div>
    <p id="pickerStatus" class="hint">Copied colors stay in this browser.</p>
  </section>

  <section id="settingsView" hidden>
    <header class="header">
      <h1>Settings</h1>
    </header>

    <label class="field-label" for="uploadUrl">Upload URL</label>
    <input id="uploadUrl" type="url" placeholder="https://your-service.onrender.com" />

    <label class="field-label" for="token">Token</label>
    <input id="token" type="password" autocomplete="off" />

    <label class="field-label" for="senderName">Sender name</label>
    <input id="senderName" type="text" placeholder="Office phone" autocomplete="off" />

    <label class="check"><input id="autoExport" type="checkbox" checked /> Auto-export on open</label>
    <label class="check"><input id="pollRemote" type="checkbox" checked /> Poll remote trigger</label>

    <button id="saveBtn" class="download-btn" type="button">Save</button>
    <p id="settingsStatus" class="status" role="status"></p>

    <label class="field-label" for="chatSelect">Manual chat</label>
    <select id="chatSelect" disabled>
      <option value="">Loading chats…</option>
    </select>

    <div class="date-row">
      <div class="date-field">
        <label class="field-label" for="fromDate">From</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="date-field">
        <label class="field-label" for="toDate">To</label>
        <input type="date" id="toDate" />
      </div>
    </div>

    <button id="downloadBtn" class="download-btn secondary" type="button" disabled>Download TXT</button>
  </section>

  <script src="popup.js"></script>
</body>

</html>
